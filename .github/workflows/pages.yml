name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the static site
        run: |
          mkdir site && cp -r index.html office.html styles.css js scenarios site/
          # Stamp asset URLs with this commit so browsers never mix an old cached script with a new page.
          sed -i "s/?v=dev\"/?v=${GITHUB_SHA::7}\"/g" site/index.html site/office.html
          grep -q "?v=${GITHUB_SHA::7}" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
